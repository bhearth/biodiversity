<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodiversity Spectrum</title>
<style>
  :root{--bg:#04070b;--text:#e8eef5;--muted:#7f8ea3;--gold:#fbbf24;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
  .brand{font-weight:800;font-size:14px;white-space:nowrap}
  .brand em{color:var(--gold);font-style:normal}
  .status{font-size:10px;color:var(--muted);font-weight:500}
  .status.live{color:#10b981}
  .search{flex:1;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:20px;padding:7px 12px;max-width:480px;transition:.2s}
  .search:focus-within{border-color:var(--gold)}
  .search input{flex:1;background:transparent;border:none;color:var(--text);outline:none;font-size:12px;font-family:inherit}
  .search .dot{width:8px;height:8px;border-radius:50%;transition:.3s}
  .icon-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .icon-btn:hover{background:rgba(255,255,255,.1);border-color:var(--gold)}
  #chips{display:flex;gap:5px;overflow-x:auto;padding:7px 14px;border-bottom:1px solid var(--line);scrollbar-width:none;flex-shrink:0}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:4px 10px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
  .chip.active{background:hsl(var(--h,50),55%,20%);border-color:hsl(var(--h,50),80%,55%);color:#fff}
  #grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:5px;padding:10px 14px;align-content:start}
  #grid::-webkit-scrollbar{width:6px}#grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
  .cell{aspect-ratio:1;background:hsl(var(--h),35%,11%);border:1px solid hsl(var(--h),50%,25%);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:3px;text-align:center;transition:.15s;overflow:hidden;position:relative}
  .cell:hover{transform:translateY(-2px) scale(1.04);background:hsl(var(--h),55%,20%);border-color:hsl(var(--h),80%,55%)}
  .cell .i{font-size:22px;line-height:1;margin-bottom:2px}
  .cell .n{font-size:7.5px;font-weight:800;text-transform:uppercase;color:#cdd6e3;line-height:1.05;word-break:break-word}
  .cell .why{position:absolute;bottom:2px;right:3px;font-size:7px;color:hsl(var(--h),80%,70%);opacity:.7}
  .page{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;overflow-y:auto;padding:18px}
  .page.open{display:block}
  .page .back{position:fixed;top:10px;left:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;font-size:17px;cursor:pointer;z-index:101;display:flex;align-items:center;justify-content:center}
  .page-inner{max-width:860px;margin:0 auto;padding-top:40px}
  .dh{text-align:center;margin-bottom:14px}
  .dh .di{font-size:70px;line-height:1;margin-bottom:4px}
  .dh .dp{font-family:Georgia,serif;font-style:italic;font-size:20px;margin-bottom:2px}
  .dh .dn{font-size:26px;font-weight:800}
  .dh .dd{font-size:9.5px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:4px}
  .badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .badge{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
  .clue{background:rgba(251,191,36,.06);border-left:3px solid var(--gold);padding:12px 14px;border-radius:8px;margin:12px 0;font-size:13.5px;line-height:1.55;color:#e8e2d5}
  .clue b{color:var(--gold)}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
  .info-box{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .info-box .lb{font-size:8.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:3px;font-weight:800}
  .info-box .vl{font-size:12px;line-height:1.3;word-break:break-word}
  .section-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:1.8px;color:var(--muted);margin:16px 0 8px;font-weight:800}
  .text-block{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.55;color:#d8dfe8}
  .list-block{display:flex;flex-direction:column;gap:5px}
  .list-item{padding:7px 10px;background:rgba(255,255,255,.03);border-radius:6px;font-size:12px}
  .list-item.good{border-left:2px solid #10b981}
  .list-item.warn{border-left:2px solid #ef4444}
  .tags-row{display:flex;flex-wrap:wrap;gap:5px}
  .tag{padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:10.5px;color:var(--muted)}
  .admin-sec{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .admin-sec h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin-bottom:10px;font-weight:800}
  .admin-input,.admin-textarea{width:100%;padding:9px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:7px;color:var(--text);font-family:inherit;font-size:12.5px;outline:none;margin-bottom:7px}
  .admin-input:focus,.admin-textarea:focus{border-color:var(--gold)}
  .admin-textarea{font-family:'Courier New',monospace;font-size:11px;min-height:170px;resize:vertical;line-height:1.5}
  .btn{padding:9px 16px;border-radius:18px;background:var(--gold);color:#000;border:none;font-weight:800;cursor:pointer;font-family:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-right:6px;margin-bottom:6px}
  .btn:hover{filter:brightness(1.1)}
  .btn.secondary{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:rgba(239,68,68,.7);color:#fff}
  .code{background:#000;color:#10b981;padding:10px;border-radius:6px;font-family:'Courier New',monospace;font-size:10.5px;overflow-x:auto;margin-bottom:10px;white-space:pre;line-height:1.5}
  .gh-status{padding:8px 12px;border-radius:8px;font-size:11.5px;margin-bottom:10px;line-height:1.5}
  .gh-status.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#6ee7b7}
  .gh-status.warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:var(--gold)}
  #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--gold);color:#000;padding:9px 18px;border-radius:18px;font-weight:800;font-size:11.5px;opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){#grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;padding:8px 10px}.cell .i{font-size:18px}.cell .n{font-size:7px}}
</style>
</head>
<body>

<header>
  <div class="brand">🌍 <em>Biodiversity</em> <span class="status" id="status">● loading</span></div>
  <div class="search">
    <span>🔍</span>
    <input id="q" placeholder="Search…" oninput="S.onSearch(this.value)" autocomplete="off">
    <span class="dot" id="dot"></span>
  </div>
  <button class="icon-btn" onclick="S.surprise()" title="Random">🎲</button>
  <button class="icon-btn" onclick="S.openAdmin()" title="Steward">⚙️</button>
</header>

<div id="chips"></div>
<main id="grid"></main>

<div class="page" id="detail-page"><button class="back" onclick="S.closeDetail()">←</button><div class="page-inner" id="detail-body"></div></div>
<div class="page" id="admin-page"><button class="back" onclick="S.closeAdmin()">←</button><div class="page-inner" id="admin-body"></div></div>
<div id="toast"></div>

<script>
const PASS = 'biodiversity';
const GH_KEY = 'gh_cfg_v1';
const DIMS = [
  {name:'Winged & Pollinators',hue:50,icon:'🐝'},{name:'Decomposers',hue:25,icon:'🪱'},
  {name:'Soil & Root',hue:90,icon:'🌱'},{name:'Water & Blue',hue:200,icon:'🌊'},
  {name:'Sky & Air',hue:190,icon:'🦅'},{name:'Forest & Flora',hue:130,icon:'🌳'},
  {name:'Savanna & Grazers',hue:100,icon:'🐄'},{name:'Faith & Festival',hue:280,icon:'🪔'},
  {name:'Meditation',hue:265,icon:'🧘'},{name:'Music',hue:320,icon:'🎵'},
  {name:'Dance Forms',hue:340,icon:'💃'},{name:'Sports & Games',hue:155,icon:'🏏'},
  {name:'Mountains & Rivers',hue:175,icon:'🏔️'},{name:'Herbs & Medicine',hue:115,icon:'🌿'},
  {name:'Foods & Ferments',hue:35,icon:'🍯'}
];

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
const STOP = new Set(['the','and','a','an','of','to','in','is','it','for','on','with','as','by','at','or','be','this','that','from','into','has','have','had','was','were']);
function tokenize(s){return String(s||'').toLowerCase().replace(/[^a-z0-9\u0900-\u097F]+/g,' ').split(/\s+/).filter(w=>w.length>1 && !STOP.has(w))}
function b64encode(str){const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function b64decode(str){const bin=atob(String(str).replace(/\n/g,''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}

const S = {
  items: [], index: {}, wordKeys: [], q: '', activeDim: null, timeout: null, ghCfg: null,

  async init(){
    this.loadGhCfg();
    this.renderChips();
    await this.pullFromGitHub(true);
  },

  // ---------- GITHUB CONFIG ----------
  loadGhCfg(){
    try { this.ghCfg = JSON.parse(localStorage.getItem(GH_KEY) || 'null') } catch { this.ghCfg = null }
  },
  saveGhCfg(cfg){ localStorage.setItem(GH_KEY, JSON.stringify(cfg)); this.ghCfg = cfg },
  clearGhCfg(){ localStorage.removeItem(GH_KEY); this.ghCfg = null },

  // ---------- GITHUB API ----------
  async ghGet(){
    const c = this.ghCfg; if (!c?.token) return null;
    const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}?ref=${c.branch}`;
    const r = await fetch(url, { headers: { Authorization: 'token ' + c.token, Accept: 'application/vnd.github+json' } });
    if (r.status === 404) return { exists: false };
    if (!r.ok) throw new Error('GitHub ' + r.status);
    return await r.json();
  },
  async ghPut(content, sha){
    const c = this.ghCfg;
    const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}`;
    const body = { message: 'items.json — ' + new Date().toISOString(), content: b64encode(content), branch: c.branch };
    if (sha) body.sha = sha;
    const r = await fetch(url, {
      method: 'PUT',
      headers: { Authorization: 'token ' + c.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message || ('GitHub ' + r.status)) }
    return await r.json();
  },

  async pullFromGitHub(silent){
    if (!this.ghCfg?.token) {
      // Fallback: load local items.json (public read, no token needed)
      try {
        const r = await fetch('items.json?t=' + Date.now());
        if (r.ok) {
          const arr = await r.json();
          this.items = Array.isArray(arr) ? arr : [];
          this.items.forEach((x,i) => { if (!x.id) x.id = 'i' + i });
          this.buildIndex(); this.renderChips();
          this.setStatus(`● ${this.items.length} items`);
          if (this.q) this.doSearch(this.q); else this.render();
        } else this.setStatus('● items.json missing');
      } catch { this.setStatus('● offline') }
      return;
    }
    try {
      const res = await this.ghGet();
      if (!res || res.exists === false) { this.items = []; this.setStatus('● empty'); return }
      const txt = b64decode(res.content);
      const arr = JSON.parse(txt);
      this.items = Array.isArray(arr) ? arr : [];
      this.items.forEach((x,i) => { if (!x.id) x.id = 'i' + i });
      this.buildIndex(); this.renderChips();
      this.setStatus(`● live · ${this.items.length}`);
      if (this.q) this.doSearch(this.q); else this.render();
      if (!silent) this.toast(`✅ Pulled ${this.items.length} items from GitHub`);
    } catch(e) {
      this.setStatus('● pull failed');
      if (!silent) this.toast('Pull failed: ' + e.message);
    }
  },

  async saveToGitHub(){
    if (!this.ghCfg?.token) throw new Error('No GitHub token configured');
    // Fetch current sha
    let sha = null;
    try { const cur = await this.ghGet(); if (cur?.sha) sha = cur.sha } catch {}
    const clean = this.items.map(({why,score,...r}) => r);
    const json = JSON.stringify(clean, null, 2);
    await this.ghPut(json, sha);
    return clean.length;
  },

  buildIndex(){
    this.index = {};
    this.items.forEach(it => {
      const text = [it.name, it.poetic, it.teaches, it.usage, it.origin, it.region,
                    ...(it.tags||[]), ...(it.benefits||[]), ...(it.risks||[])].join(' ');
      new Set(tokenize(text)).forEach(w => {
        if (!this.index[w]) this.index[w] = new Set();
        this.index[w].add(it.id);
      });
    });
    this.wordKeys = Object.keys(this.index).sort();
  },

  setStatus(s){ document.getElementById('status').textContent = s },

  renderChips(){
    const used = [...new Set(this.items.map(x=>x.dimension).filter(Boolean))].sort();
    document.getElementById('chips').innerHTML =
      `<button class="chip ${!this.activeDim?'active':''}" onclick="S.setDim(null)">🌍 All</button>` +
      used.map(name => {
        const d = DIMS.find(x=>x.name===name) || { name, hue: hash(name)%360, icon:'✨' };
        return `<button class="chip ${this.activeDim===name?'active':''}" style="--h:${d.hue}" onclick="S.setDim('${name.replace(/'/g,"\\'")}')">${d.icon} ${name}</button>`;
      }).join('');
  },

  setDim(name){ this.activeDim = name; this.renderChips(); if (this.q) this.doSearch(this.q); else this.render() },

  cellHTML(x){
    const d = DIMS.find(d=>d.name===x.dimension) || { hue: hash(x.dimension||x.name)%360 };
    const hue = (d.hue + (hash(x.name)%40) - 20 + 360) % 360;
    return `<div class="cell" style="--h:${hue}" onclick="S.select('${x.id}')" title="${x.name}">
      <div class="i">${x.icon||'✨'}</div><div class="n">${x.name}</div>
      ${x.why?`<div class="why">${x.why}</div>`:''}
    </div>`;
  },

  render(){
    let list = this.items;
    if (this.activeDim) list = list.filter(x=>x.dimension===this.activeDim);
    document.getElementById('grid').innerHTML = list.length ? list.map(x=>this.cellHTML(x)).join('') :
      `<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);font-size:12px">No items. Add via ⚙️</div>`;
  },

  onSearch(q){
    this.q = q.trim();
    const dot = document.getElementById('dot');
    if (!this.q){ dot.style.background='transparent'; dot.style.boxShadow='none'; this.render(); return }
    const h = hash(this.q)%360;
    dot.style.background=`hsl(${h},80%,60%)`; dot.style.boxShadow=`0 0 10px hsl(${h},80%,60%)`;
    clearTimeout(this.timeout);
    this.timeout = setTimeout(()=>this.doSearch(this.q), 150);
  },

  doSearch(q){
    const tokens = tokenize(q); if (!tokens.length) return this.render();
    const sets = tokens.map(t => {
      const s = new Set();
      if (this.index[t]) this.index[t].forEach(id=>s.add(id));
      for (const k of this.wordKeys) if (k.startsWith(t) && k!==t) this.index[k].forEach(id=>s.add(id));
      return s;
    });
    let cand = sets[0] || new Set();
    for (let i=1;i<sets.length;i++){ const n=new Set(); cand.forEach(id=>{ if(sets[i].has(id)) n.add(id) }); cand=n }

    const scored = [...cand].map(id => {
      const it = this.items.find(x=>x.id===id); if (!it) return null;
      let score = 0; const why = [];
      const n = (it.name||'').toLowerCase(), p = (it.poetic||'').toLowerCase();
      const tags = (it.tags||[]).map(x=>x.toLowerCase());
      const t = (it.teaches||'').toLowerCase(), u = (it.usage||'').toLowerCase();
      tokens.forEach(tk => {
        if (n === tk) { score+=100; why.push('name') }
        else if (n.startsWith(tk)) { score+=60; why.push('name') }
        else if (n.includes(tk)) { score+=30; why.push('name') }
        else if (p.includes(tk)) { score+=20; why.push('poetic') }
        else if (tags.some(tag=>tag.includes(tk))) { score+=15; why.push('tag') }
        else if (t.includes(tk)) { score+=8; why.push('teaches') }
        else if (u.includes(tk)) { score+=5; why.push('usage') }
      });
      return { ...it, score, why: [...new Set(why)].join(',') };
    }).filter(Boolean).sort((a,b)=>b.score-a.score);

    let list = scored;
    if (this.activeDim) list = list.filter(x=>x.dimension===this.activeDim);
    document.getElementById('grid').innerHTML = list.length ? list.map(x=>this.cellHTML(x)).join('') :
      `<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);font-size:12px">No matches for "${q}"</div>`;
  },

  select(id){
    const item = this.items.find(x=>x.id===id); if (!item) return;
    const d = DIMS.find(d=>d.name===item.dimension) || { hue: hash(item.dimension||item.name)%360 };
    const hue = (d.hue + (hash(item.name)%40) - 20 + 360) % 360;
    let html = `<div class="dh">
      <div class="di">${item.icon||'✨'}</div>
      ${item.poetic?`<div class="dp" style="color:hsl(${hue},80%,68%)">${item.poetic}</div>`:''}
      <div class="dn">${item.name}</div>
      <div class="dd">${item.dimension||'—'}</div>
    </div>`;
    const badges = [];
    if (item.category) badges.push(`<span class="badge" style="background:hsl(${hue},60%,20%);color:hsl(${hue},80%,70%)">${item.category}</span>`);
    if (item.from_species) badges.push(`<span class="badge" style="background:rgba(251,191,36,.15);color:var(--gold)">from ${item.from_species}</span>`);
    if (badges.length) html += `<div class="badges">${badges.join('')}</div>`;
    if (item.teaches) html += `<div class="clue"><b>Clue →</b> ${item.teaches}</div>`;
    const boxes = [];
    if (item.origin) boxes.push(this.iBox('Origin', item.origin));
    if (item.region) boxes.push(this.iBox('Region', item.region));
    if (item.season) boxes.push(this.iBox('Season', item.season));
    if (item.duration) boxes.push(this.iBox('Duration', item.duration));
    if (boxes.length) html += `<div class="info-grid">${boxes.join('')}</div>`;
    if (item.usage) html += `<div class="section-lbl">How humans use it</div><div class="text-block">${item.usage}</div>`;
    if (item.benefits?.length) html += `<div class="section-lbl">Benefits</div><div class="list-block">${item.benefits.map(b=>`<div class="list-item good">✓ ${b}</div>`).join('')}</div>`;
    if (item.risks?.length) html += `<div class="section-lbl">Risks</div><div class="list-block">${item.risks.map(r=>`<div class="list-item warn">⚠ ${r}</div>`).join('')}</div>`;
    if (item.tags?.length) html += `<div class="section-lbl">Tags</div><div class="tags-row">${item.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>`;
    document.getElementById('detail-body').innerHTML = html;
    document.getElementById('detail-page').classList.add('open');
    document.getElementById('detail-page').scrollTop = 0;
  },

  iBox(l,v){ return `<div class="info-box"><div class="lb">${l}</div><div class="vl">${v}</div></div>` },
  closeDetail(){ document.getElementById('detail-page').classList.remove('open') },

  surprise(){
    if (!this.items.length) return;
    const it = this.items[Math.floor(Math.random()*this.items.length)];
    this.select(it.id); this.toast(`🎲 ${it.icon||''} ${it.name}`);
  },

  toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(this._tt); this._tt = setTimeout(()=>t.classList.remove('show'), 2600);
  },

  // ---------- ADMIN ----------
  openAdmin(){
    document.getElementById('admin-body').innerHTML = `
      <div style="text-align:center;margin-bottom:16px">
        <h1 style="font-size:22px;font-weight:800">⚙️ Steward</h1>
        <p style="color:var(--muted);font-size:11.5px">Password: <code style="color:var(--gold)">${PASS}</code></p>
      </div>
      <div class="admin-sec">
        <input type="password" class="admin-input" id="admin-pass" placeholder="Password" style="font-size:16px;padding:12px;text-align:center" autofocus>
        <button class="btn" style="width:100%" onclick="S.tryAdmin()">Enter</button>
      </div>`;
    document.getElementById('admin-page').classList.add('open');
    setTimeout(()=>{
      const el = document.getElementById('admin-pass');
      if (el) el.addEventListener('keypress', e => { if (e.key==='Enter') S.tryAdmin() });
    }, 100);
  },

  tryAdmin(){
    if ((document.getElementById('admin-pass').value||'').trim().toLowerCase() !== PASS) return this.toast('Wrong password');
    this.renderAdmin();
  },

  renderAdmin(){
    const c = this.ghCfg;
    const ghStatus = c?.token
      ? `<div class="gh-status ok">✅ Connected · <b>${c.owner}/${c.repo}</b> · branch <b>${c.branch}</b> · file <b>${c.path}</b></div>`
      : `<div class="gh-status warn">⚠️ GitHub not connected — additions save locally only. Set up below.</div>`;

    document.getElementById('admin-body').innerHTML = `
      <div style="text-align:center;margin-bottom:16px">
        <h1 style="font-size:20px;font-weight:800">✅ Steward Panel</h1>
        <p style="color:var(--muted);font-size:11px">${this.items.length} items loaded</p>
      </div>

      <div class="admin-sec">
        <h3>🔗 GitHub Sync</h3>
        ${ghStatus}
        <details style="margin-top:8px">
          <summary style="cursor:pointer;font-size:11.5px;color:var(--gold);font-weight:700;padding:4px 0">${c?.token?'Change settings':'Set up GitHub sync'}</summary>
          <div style="margin-top:10px">
            <div class="code">Setup (5 minutes):
1. github.com → Settings → Developer settings
   → Personal access tokens → Fine-grained tokens
   → Generate new token
2. Repository access: Only select repositories
   → pick your repo
3. Permissions → Contents: Read and write
4. Copy the token (github_pat_...)
5. Fill the fields below and click Connect

Token stays in YOUR browser only.
Visitors never see it.</div>
            <input class="admin-input" id="gh-owner" placeholder="Owner (e.g. krishna)" value="${c?.owner||''}">
            <input class="admin-input" id="gh-repo" placeholder="Repo (e.g. khela)" value="${c?.repo||''}">
            <input class="admin-input" id="gh-branch" placeholder="Branch (e.g. main)" value="${c?.branch||'main'}">
            <input class="admin-input" id="gh-path" placeholder="File path (e.g. items.json)" value="${c?.path||'items.json'}">
            <input class="admin-input" id="gh-token" type="password" placeholder="Token (github_pat_...)" value="${c?.token||''}">
            <button class="btn" onclick="S.connectGH()">Connect</button>
            <button class="btn secondary" onclick="S.testGH()">Test</button>
            ${c?.token?`<button class="btn danger" onclick="S.disconnectGH()">Disconnect</button>`:''}
          </div>
        </details>
      </div>

      <div class="admin-sec">
        <h3>📥 Add items (auto-saves to GitHub)</h3>
        <div class="code">[{
  "name": "Civet",           ← required
  "icon": "🐈",              ← required
  "poetic": "bitter reformer",
  "teaches": "A civet eats...",
  "tags": ["food","bitter"],
  "category": "species",
  "dimension": "Foods & Ferments",
  "region": "Southeast Asia",
  "usage": "...",
  "benefits": ["..."],
  "risks": ["..."]
}]

Only name + icon required. Dimension auto-assigned by tags.</div>
        <textarea class="admin-textarea" id="admin-json" placeholder='[{"name":"...","icon":"..."}]'></textarea>
        <button class="btn" onclick="S.addItems()">＋ Add ${c?.token?'(→ GitHub)':'(memory only)'}</button>
        <button class="btn secondary" onclick="S.loadSample()">Load Sample</button>
      </div>

      <div class="admin-sec">
        <h3>⚡ Manual controls</h3>
        <button class="btn secondary" onclick="S.pullFromGitHub(false)">⬇ Pull from GitHub</button>
        <button class="btn secondary" onclick="S.forceSave()">💾 Force Save to GitHub</button>
        <button class="btn secondary" onclick="S.download()">⬇ Download JSON</button>
      </div>

      <div class="admin-sec">
        <h3>📋 Current items (${this.items.length})</h3>
        <div style="max-height:200px;overflow-y:auto;font-size:11.5px;line-height:1.7">
          ${this.items.map((x,i)=>`${i+1}. ${x.icon||'✨'} <b>${x.name}</b> <span style="color:var(--muted)">— ${x.dimension||'—'}</span>`).join('<br>')}
        </div>
      </div>

      <div class="admin-sec">
        <h3>ℹ️ How it works</h3>
        <p style="color:var(--muted);font-size:11px;line-height:1.6">
          <b>Add</b> → pushes to memory + commits to <code>${c?.path||'items.json'}</code> on GitHub.<br>
          <b>Live in ~30 seconds</b> — GitHub Pages rebuild takes that long.<br>
          <b>Pull</b> → fetches the latest file from GitHub into memory.<br>
          <b>Force Save</b> → writes memory back to GitHub (for recovery).<br><br>
          Token in localStorage only. Fine-grained PAT scoped to this one repo.
        </p>
      </div>`;
  },

  async connectGH(){
    const cfg = {
      owner: document.getElementById('gh-owner').value.trim(),
      repo: document.getElementById('gh-repo').value.trim(),
      branch: document.getElementById('gh-branch').value.trim() || 'main',
      path: document.getElementById('gh-path').value.trim() || 'items.json',
      token: document.getElementById('gh-token').value.trim()
    };
    if (!cfg.owner || !cfg.repo || !cfg.token) return this.toast('Owner, repo, and token required');
    this.saveGhCfg(cfg);
    await this.testGH();
    this.renderAdmin();
  },

  async testGH(){
    try {
      const res = await this.ghGet();
      if (!res) return this.toast('No config');
      if (res.exists === false) this.toast('⚠️ File not found — first Add will create it');
      else this.toast('✅ Connected — file exists on GitHub');
      this.setStatus('● live');
    } catch(e) { this.toast('❌ ' + e.message) }
  },

  disconnectGH(){
    if (!confirm('Disconnect GitHub? Additions will go to memory only.')) return;
    this.clearGhCfg();
    this.renderAdmin();
    this.toast('Disconnected');
  },

  async addItems(){
    const raw = document.getElementById('admin-json').value.trim();
    if (!raw) return this.toast('Paste JSON first');
    let data;
    try { data = JSON.parse(raw) } catch(e){ return this.toast('Invalid JSON: '+e.message.slice(0,30)) }
    const arr = Array.isArray(data) ? data : [data];
    let n = 0;
    arr.forEach(c => {
      if (!c.name || !c.icon) return;
      if (!c.dimension) {
        const scores = {};
        this.items.forEach(it => {
          const ov = (it.tags||[]).filter(t=>(c.tags||[]).includes(t)).length;
          if (ov) scores[it.dimension] = (scores[it.dimension]||0)+ov;
        });
        const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
        c.dimension = best ? best[0] : 'Uncategorized';
      }
      c.id = c.id || ('i' + Date.now().toString(36) + Math.random().toString(36).slice(2,6));
      this.items.push(c); n++;
    });
    if (!n) return this.toast('Nothing valid — name + icon required');
    this.buildIndex(); this.renderChips(); this.render();
    this.setStatus(`● ${this.items.length} items`);
    document.getElementById('admin-json').value = '';

    if (this.ghCfg?.token) {
      this.toast(`Saving ${n} to GitHub…`);
      try {
        const total = await this.saveToGitHub();
        this.toast(`✅ ${n} added · ${total} total on GitHub (live in ~30s)`);
        this.setStatus(`● live · ${total}`);
      } catch(e) {
        this.toast('❌ GitHub save failed: ' + e.message + ' — use Force Save');
      }
    } else {
      this.toast(`Added ${n} in memory — connect GitHub to auto-save`);
    }
    this.renderAdmin();
  },

  async forceSave(){
    if (!this.ghCfg?.token) return this.toast('Connect GitHub first');
    try {
      const total = await this.saveToGitHub();
      this.toast(`✅ Saved ${total} items to GitHub`);
    } catch(e) { this.toast('❌ ' + e.message) }
  },

  loadSample(){
    document.getElementById('admin-json').value = JSON.stringify([{
      name:'Civet', icon:'🐈', poetic:'bitter reformer',
      teaches:'A civet eats the coffee bean, its gut makes it bitter. Why pay more for what was made worse?',
      tags:['food','bitter','wonder'], category:'species',
      dimension:'Foods & Ferments', region:'Southeast Asia',
      usage:'In the wild, a civet eats coffee cherries; the fermented beans are collected from its droppings.',
      benefits:['unique flavour'], risks:['animal cruelty in caged farming']
    }, {
      name:'Kalaripayattu', icon:'🥋', poetic:'martial heritage',
      teaches:'What strikes and what protects?',
      tags:['sport','martial','india'], category:'sport',
      dimension:'Sports & Games', origin:'Kerala', region:'South India',
      usage:'Ancient Indian martial art of striking, grappling, and weapons.',
      benefits:['fitness','discipline','self-defence']
    }], null, 2);
    this.toast('Sample loaded');
  },

  download(){
    const clean = this.items.map(({why, score, ...r}) => r);
    const blob = new Blob([JSON.stringify(clean, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'items.json'; a.click();
    URL.revokeObjectURL(url);
    this.toast('Downloaded items.json');
  },

  closeAdmin(){ document.getElementById('admin-page').classList.remove('open') }
};

window.onload = () => S.init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodiversity Spectrum · Live</title>
<style>
  :root{--bg:#04070b;--text:#e8eef5;--muted:#7f8ea3;--gold:#fbbf24;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
  .brand{font-weight:800;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .brand em{color:var(--gold);font-style:normal}
  .status{font-size:10px;color:var(--muted);font-weight:500}
  .status.live{color:#10b981}
  .search{flex:1;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:20px;padding:7px 12px;max-width:480px;transition:.2s}
  .search:focus-within{border-color:var(--gold);box-shadow:0 0 12px rgba(251,191,36,.15)}
  .search input{flex:1;background:transparent;border:none;color:var(--text);outline:none;font-size:12px;font-family:inherit}
  .search .dot{width:8px;height:8px;border-radius:50%;transition:.3s}
  .icon-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
  .icon-btn:hover{background:rgba(255,255,255,.1);border-color:var(--gold)}
  #chips{display:flex;gap:5px;overflow-x:auto;padding:7px 14px;border-bottom:1px solid var(--line);scrollbar-width:none;flex-shrink:0}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:4px 10px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
  .chip.active{background:hsl(var(--h,50),55%,20%);border-color:hsl(var(--h,50),80%,55%);color:#fff}
  #grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:5px;padding:10px 14px;align-content:start}
  #grid::-webkit-scrollbar{width:6px}#grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
  .cell{aspect-ratio:1;background:hsl(var(--h),35%,11%);border:1px solid hsl(var(--h),50%,25%);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:3px;text-align:center;transition:.15s;overflow:hidden}
  .cell:hover{transform:translateY(-2px) scale(1.04);background:hsl(var(--h),55%,20%);border-color:hsl(var(--h),80%,55%)}
  .cell .i{font-size:22px;line-height:1;margin-bottom:2px}
  .cell .n{font-size:7.5px;font-weight:800;text-transform:uppercase;color:#cdd6e3;line-height:1.05;word-break:break-word}
  .cell .why{position:absolute;bottom:2px;right:3px;font-size:7px;color:hsl(var(--h),80%,70%);opacity:.7;text-transform:lowercase}
  .page{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;overflow-y:auto;padding:18px}
  .page.open{display:block}
  .page .back{position:fixed;top:10px;left:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;font-size:17px;cursor:pointer;z-index:101;display:flex;align-items:center;justify-content:center}
  .page-inner{max-width:860px;margin:0 auto;padding-top:40px}
  .dh{text-align:center;margin-bottom:14px}
  .dh .di{font-size:70px;line-height:1;margin-bottom:4px}
  .dh .dp{font-family:Georgia,serif;font-style:italic;font-size:20px;margin-bottom:2px}
  .dh .dn{font-size:26px;font-weight:800}
  .dh .dd{font-size:9.5px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:4px}
  .badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .badge{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
  .clue{background:rgba(251,191,36,.06);border-left:3px solid var(--gold);padding:12px 14px;border-radius:8px;margin:12px 0;font-size:13.5px;line-height:1.55;color:#e8e2d5}
  .clue b{color:var(--gold)}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
  .info-box{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .info-box .lb{font-size:8.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:3px;font-weight:800}
  .info-box .vl{font-size:12px;line-height:1.3;word-break:break-word}
  .section-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:1.8px;color:var(--muted);margin:16px 0 8px;font-weight:800}
  .text-block{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.55;color:#d8dfe8}
  .list-block{display:flex;flex-direction:column;gap:5px}
  .list-item{padding:7px 10px;background:rgba(255,255,255,.03);border-radius:6px;font-size:12px}
  .list-item.good{border-left:2px solid #10b981}
  .list-item.warn{border-left:2px solid #ef4444}
  .tags-row{display:flex;flex-wrap:wrap;gap:5px}
  .tag{padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:10.5px;color:var(--muted)}
  .link-chip{padding:5px 11px;border-radius:14px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:var(--gold);font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .weave-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
  .wcard{padding:10px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .wcard:hover{border-color:var(--gold);background:rgba(251,191,36,.06)}
  .wcard .wi{font-size:20px}.wcard .wn{font-size:11px;font-weight:800}
  .wcard .wp{font-size:9.5px;font-style:italic;color:var(--muted);font-family:Georgia,serif}
  .wcard .wd{font-size:7.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:2px}
  .admin-sec{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .admin-sec h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin-bottom:10px;font-weight:800}
  .admin-input,.admin-textarea{width:100%;padding:9px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:7px;color:var(--text);font-family:inherit;font-size:12.5px;outline:none;margin-bottom:7px}
  .admin-input:focus,.admin-textarea:focus{border-color:var(--gold)}
  .admin-textarea{font-family:'Courier New',monospace;font-size:11px;min-height:170px;resize:vertical;line-height:1.5}
  .btn{padding:9px 16px;border-radius:18px;background:var(--gold);color:#000;border:none;font-weight:800;cursor:pointer;font-family:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-right:6px;margin-bottom:6px}
  .btn.secondary{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:rgba(239,68,68,.7);color:#fff}
  .code{background:#000;color:#10b981;padding:10px;border-radius:6px;font-family:'Courier New',monospace;font-size:10.5px;overflow-x:auto;margin-bottom:10px;white-space:pre;line-height:1.5}
  .custom-list{max-height:200px;overflow-y:auto}
  .custom-item{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;border-bottom:1px solid var(--line);font-size:11.5px}
  .custom-item button{background:rgba(239,68,68,.5);color:#fff;border:none;padding:2px 7px;border-radius:5px;cursor:pointer;font-size:10px}
  #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--gold);color:#000;padding:9px 18px;border-radius:18px;font-weight:800;font-size:11.5px;opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){#grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;padding:8px 10px}.cell .i{font-size:18px}.cell .n{font-size:7px}}
</style>
</head>
<body>

<header>
  <div class="brand">🌍 <em>Biodiversity</em> <span class="status" id="status">● connecting</span></div>
  <div class="search">
    <span>🔍</span>
    <input id="q" placeholder="Search species, festivals, medicines, sports…" oninput="S.onSearchInput(this.value)" autocomplete="off">
    <span class="dot" id="dot"></span>
  </div>
  <button class="icon-btn" onclick="S.surprise()" title="Random">🎲</button>
  <button class="icon-btn" onclick="S.openAdmin()" title="Steward">⚙️</button>
</header>

<div id="chips"></div>
<main id="grid"></main>

<div class="page" id="detail-page"><button class="back" onclick="S.closeDetail()">←</button><div class="page-inner" id="detail-body"></div></div>
<div class="page" id="admin-page"><button class="back" onclick="S.closeAdmin()">←</button><div class="page-inner" id="admin-body"></div></div>
<div id="toast"></div>

<script>
const PASS = 'biodiversity';
const DIMS = [
  {name:'Winged & Pollinators', hue:50, icon:'🐝'},
  {name:'Decomposers', hue:25, icon:'🪱'},
  {name:'Soil & Root', hue:90, icon:'🌱'},
  {name:'Water & Blue', hue:200, icon:'🌊'},
  {name:'Sky & Air', hue:190, icon:'🦅'},
  {name:'Forest & Flora', hue:130, icon:'🌳'},
  {name:'Savanna & Grazers', hue:100, icon:'🐄'},
  {name:'Faith & Festival', hue:280, icon:'🪔'},
  {name:'Meditation', hue:265, icon:'🧘'},
  {name:'Music', hue:320, icon:'🎵'},
  {name:'Dance Forms', hue:340, icon:'💃'},
  {name:'Sports & Games', hue:155, icon:'🏏'},
  {name:'Mountains & Rivers', hue:175, icon:'🏔️'},
  {name:'Herbs & Medicine', hue:115, icon:'🌿'},
  {name:'Foods & Ferments', hue:35, icon:'🍯'}
];

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}

const S = {
  items: [], total: 0, q: '', activeDim: null, timeout: null, abort: null,

  async init(){ this.renderChips(); await this.loadItems(); },

  async loadItems(){
    this.setStatus('connecting');
    try {
      const r = await fetch('/api/items?limit=5000');
      const d = await r.json();
      this.items = d.items; this.total = d.total;
      this.setStatus(`live · ${d.total}`);
      this.render();
    } catch { this.setStatus('offline') }
  },

  setStatus(s){
    const el = document.getElementById('status');
    el.textContent = '● ' + s;
    el.className = 'status' + (s.startsWith('live') ? ' live' : '');
  },

  renderChips(){
    const used = [...new Set(this.items.map(x=>x.dimension).filter(Boolean))].sort();
    const chips = used.map(name => {
      const d = DIMS.find(x=>x.name===name) || { name, hue: hash(name)%360, icon:'✨' };
      return `<button class="chip ${this.activeDim===name?'active':''}" style="--h:${d.hue}" onclick="S.setDim('${name.replace(/'/g,"\\'")}')">${d.icon} ${name}</button>`;
    });
    document.getElementById('chips').innerHTML =
      `<button class="chip ${!this.activeDim?'active':''}" onclick="S.setDim(null)">🌍 All</button>` + chips.join('');
  },

  setDim(name){ this.activeDim = name; this.renderChips(); if (this.q) this.doSearch(this.q); else this.render(); },

  cellHTML(x){
    const d = DIMS.find(d=>d.name===x.dimension) || { hue: hash(x.dimension||x.name)%360 };
    const hue = d.hue + (hash(x.name)%40) - 20;
    return `<div class="cell" style="--h:${hue}" onclick="S.select('${x.id}')" title="${x.name}">
      <div class="i">${x.icon}</div><div class="n">${x.name}</div>
      ${x.why?`<div class="why">${x.why}</div>`:''}
    </div>`;
  },

  render(){
    let list = this.items;
    if (this.activeDim) list = list.filter(x => x.dimension === this.activeDim);
    document.getElementById('grid').innerHTML = list.length ? list.map(x=>this.cellHTML(x)).join('') :
      `<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);font-size:12px">No items. Upload via ⚙️</div>`;
  },

  onSearchInput(q){
    this.q = q.trim();
    const dot = document.getElementById('dot');
    if (!this.q) { dot.style.background='transparent'; dot.style.boxShadow='none'; this.render(); return }
    const h = hash(this.q)%360;
    dot.style.background=`hsl(${h},80%,60%)`; dot.style.boxShadow=`0 0 10px hsl(${h},80%,60%)`;
    clearTimeout(this.timeout);
    this.timeout = setTimeout(() => this.doSearch(this.q), 250);
  },

  async doSearch(q){
    if (this.abort) this.abort.abort();
    this.abort = new AbortController();
    try {
      const r = await fetch('/api/search?q='+encodeURIComponent(q), {signal:this.abort.signal});
      const d = await r.json();
      let list = d.items;
      if (this.activeDim) list = list.filter(x=>x.dimension===this.activeDim);
      document.getElementById('grid').innerHTML = list.length ? list.map(x=>this.cellHTML(x)).join('') :
        `<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);font-size:12px">No matches for "${q}"</div>`;
    } catch(e){ if (e.name !== 'AbortError') console.error(e) }
  },

  async select(id){
    document.getElementById('detail-page').classList.add('open');
    document.getElementById('detail-body').innerHTML = '<div style="padding:60px;text-align:center;color:var(--muted)">Loading…</div>';
    try {
      const r = await fetch('/api/item/'+encodeURIComponent(id));
      this.renderDetail(await r.json());
    } catch { document.getElementById('detail-body').innerHTML = '<div style="padding:60px;text-align:center;color:var(--muted)">Could not load</div>' }
  },

  renderDetail(item){
    const d = DIMS.find(d=>d.name===item.dimension) || { hue: hash(item.dimension||item.name)%360 };
    const hue = d.hue + (hash(item.name)%40) - 20;

    let html = `<div class="dh">
      <div class="di">${item.icon}</div>
      ${item.poetic?`<div class="dp" style="color:hsl(${hue},80%,68%)">${item.poetic}</div>`:''}
      <div class="dn">${item.name}</div>
      <div class="dd">${item.dimension||'—'}</div>
    </div>`;

    const badges = [];
    if (item.category) badges.push(`<span class="badge" style="background:hsl(${hue},60%,20%);color:hsl(${hue},80%,70%)">${item.category}</span>`);
    if (item.from_species) badges.push(`<span class="link-chip">from ${item.from_species}</span>`);
    if (badges.length) html += `<div class="badges">${badges.join('')}</div>`;

    if (item.teaches) html += `<div class="clue"><b>Clue →</b> ${item.teaches}</div>`;

    const boxes = [];
    if (item.origin) boxes.push(this.iBox('Origin', item.origin));
    if (item.region) boxes.push(this.iBox('Region', item.region));
    if (item.season) boxes.push(this.iBox('Season', item.season));
    if (item.duration) boxes.push(this.iBox('Duration', item.duration));
    if (boxes.length) html += `<div class="info-grid">${boxes.join('')}</div>`;

    if (item.usage) html += `<div class="section-lbl">How humans use it</div><div class="text-block">${item.usage}</div>`;
    if (item.benefits?.length) html += `<div class="section-lbl">Benefits</div><div class="list-block">${item.benefits.map(b=>`<div class="list-item good">✓ ${b}</div>`).join('')}</div>`;
    if (item.risks?.length) html += `<div class="section-lbl">Risks</div><div class="list-block">${item.risks.map(r=>`<div class="list-item warn">⚠ ${r}</div>`).join('')}</div>`;
    if (item.tags?.length) html += `<div class="section-lbl">Tags</div><div class="tags-row">${item.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>`;

    document.getElementById('detail-body').innerHTML = html;
    document.getElementById('detail-page').scrollTop = 0;
  },

  iBox(l,v){ return `<div class="info-box"><div class="lb">${l}</div><div class="vl">${v}</div></div>` },

  closeDetail(){ document.getElementById('detail-page').classList.remove('open') },

  surprise(){
    if (!this.items.length) return;
    const it = this.items[Math.floor(Math.random()*this.items.length)];
    this.select(it.id); this.toast(`🎲 ${it.icon} ${it.name}`);
  },

  toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(this._tt); this._tt = setTimeout(()=>t.classList.remove('show'), 2400);
  },

  // ─── ADMIN ───
  openAdmin(){
    document.getElementById('admin-body').innerHTML = `
      <div style="text-align:center;margin-bottom:16px">
        <h1 style="font-size:22px;font-weight:800">⚙️ Steward</h1>
        <p style="color:var(--muted);font-size:11.5px">Single user. Password: <code style="color:var(--gold)">${PASS}</code></p>
      </div>
      <div class="admin-sec">
        <input type="password" class="admin-input" id="admin-pass" placeholder="Password" style="font-size:16px;padding:12px;text-align:center" autofocus>
        <button class="btn" style="width:100%" onclick="S.tryAdmin()">Enter</button>
      </div>`;
    document.getElementById('admin-page').classList.add('open');
    setTimeout(()=>{
      const el = document.getElementById('admin-pass');
      if (el) el.addEventListener('keypress', e => { if (e.key==='Enter') S.tryAdmin() });
    }, 100);
  },

  tryAdmin(){
    if ((document.getElementById('admin-pass').value||'').trim().toLowerCase() !== PASS) { this.toast('Wrong password'); return }
    this.renderAdmin();
  },

  renderAdmin(){
    const list = this.items;
    document.getElementById('admin-body').innerHTML = `
      <div style="text-align:center;margin-bottom:16px">
        <h1 style="font-size:20px;font-weight:800">✅ Steward Panel</h1>
        <p style="color:var(--muted);font-size:11px">${this.total} items on server</p>
      </div>

      <div class="admin-sec">
        <h3>📥 Upload to server (JSON)</h3>
        <div class="code">[{
  "name": "Civet",            ← required
  "icon": "🐈",               ← required
  "dimension": "Foods & Ferments",
  "poetic": "bitter reformer",
  "teaches": "A civet eats...",
  "tags": ["food","bitter"],
  "category": "species",
  "usage": "In the wild...",
  "region": "Southeast Asia",
  "benefits": ["..."],
  "risks": ["..."]
}]

Only name + icon are required.
Dimension auto-assigned by tags if omitted.</div>
        <textarea class="admin-textarea" id="admin-json" placeholder='[{"name":"...","icon":"..."}]'></textarea>
        <button class="btn" onclick="S.upload()">↑ Upload</button>
        <button class="btn secondary" onclick="S.loadSample()">Load Sample</button>
      </div>

      <div class="admin-sec">
        <h3>📋 Live items on server (${this.total})</h3>
        <div class="custom-list">${list.length?list.map(c=>`
          <div class="custom-item"><span>${c.icon||'✨'} <b>${c.name}</b> <span style="color:var(--muted);font-size:10px">${c.dimension||'—'}</span></span>
          <button onclick="S.deleteItem('${c.id}','${c.name.replace(/'/g,"\\'")}')">×</button></div>`).join(''):'<p style="color:var(--muted);font-size:11px">No items yet.</p>'}</div>
      </div>

      <div class="admin-sec">
        <h3>⚡ How it works</h3>
        <p style="color:var(--muted);font-size:11px;line-height:1.6">
          <b>Upload</b> → <code>POST /api/items</code> → server appends to memory + saves <code>items.json</code> + rebuilds index.<br>
          <b>Search</b> → <code>GET /api/search?q=...</code> → looks up in-memory inverted index → returns only matches (never scans file).<br>
          <b>Delete</b> → <code>DELETE /api/item/:id</code> → removes + saves + rebuilds index.
        </p>
      </div>`;
  },

  loadSample(){
    document.getElementById('admin-json').value = JSON.stringify([{
      name:'Civet', icon:'🐈', poetic:'bitter reformer',
      teaches:'A civet eats the coffee bean, its gut makes it bitter. Why pay more for what was made worse?',
      tags:['food','bitter','wonder'], category:'species',
      dimension:'Foods & Ferments', region:'Southeast Asia',
      usage:'In the wild, a civet eats coffee cherries; the fermented beans are collected from its droppings.',
      benefits:['unique flavour'], risks:['animal cruelty in caged farming']
    }, {
      name:'Kalaripayattu', icon:'🥋', poetic:'martial heritage',
      teaches:'What strikes and what protects?',
      tags:['sport','martial','india'], category:'sport',
      dimension:'Sports & Games', origin:'Kerala', region:'South India',
      usage:'Ancient Indian martial art of striking, grappling, and weapons.',
      benefits:['fitness','discipline','self-defence']
    }], null, 2);
    this.toast('Sample loaded — click Upload');
  },

  async upload(){
    const raw = document.getElementById('admin-json').value.trim();
    if (!raw) return this.toast('Paste JSON first');
    let data;
    try { data = JSON.parse(raw) } catch { return this.toast('Invalid JSON') }
    try {
      const r = await fetch('/api/items', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Steward-Pass':PASS},
        body: JSON.stringify(data)
      });
      const res = await r.json();
      if (!r.ok) return this.toast('❌ ' + (res.error||'unauthorized'));
      this.toast(`✅ Added ${res.added}, updated ${res.updated}. Total: ${res.total}`);
      await this.loadItems();
      this.renderAdmin();
    } catch { this.toast('Upload failed') }
  },

  async deleteItem(id, name){
    if (!confirm(`Delete "${name}" permanently?`)) return;
    try {
      const r = await fetch('/api/item/'+id, {method:'DELETE', headers:{'X-Steward-Pass':PASS}});
      if (!r.ok) return this.toast('Delete failed');
      await this.loadItems();
      this.renderAdmin();
      this.toast('Deleted');
    } catch { this.toast('Delete failed') }
  },

  closeAdmin(){ document.getElementById('admin-page').classList.remove('open') }
};

window.onload = () => S.init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodiversity Spectrum · Universal</title>
<style>
  :root{--bg:#04070b;--text:#e8eef5;--muted:#7f8ea3;--gold:#fbbf24;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
  .brand{font-weight:800;font-size:14px;white-space:nowrap}
  .brand em{color:var(--gold);font-style:normal}
  .search{flex:1;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:20px;padding:7px 12px;max-width:480px;transition:.2s}
  .search:focus-within{border-color:var(--gold);box-shadow:0 0 12px rgba(251,191,36,.15)}
  .search input{flex:1;background:transparent;border:none;color:var(--text);outline:none;font-size:12px;font-family:inherit}
  .search .dot{width:8px;height:8px;border-radius:50%;transition:.3s}
  .icon-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
  .icon-btn:hover{background:rgba(255,255,255,.1);border-color:var(--gold)}
  #chips{display:flex;gap:5px;overflow-x:auto;padding:7px 14px;border-bottom:1px solid var(--line);scrollbar-width:none;flex-shrink:0}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:4px 10px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s}
  .chip:hover{background:rgba(255,255,255,.08)}
  .chip.active{background:hsl(var(--h,50),55%,20%);border-color:hsl(var(--h,50),80%,55%);color:#fff}
  #grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:5px;padding:10px 14px;align-content:start}
  #grid::-webkit-scrollbar{width:6px}
  #grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
  .cell{aspect-ratio:1;background:hsl(var(--h),35%,11%);border:1px solid hsl(var(--h),50%,25%);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:3px;text-align:center;transition:.15s;overflow:hidden}
  .cell:hover{transform:translateY(-2px) scale(1.04);background:hsl(var(--h),55%,20%);border-color:hsl(var(--h),80%,55%);box-shadow:0 6px 14px rgba(0,0,0,.5)}
  .cell .i{font-size:22px;line-height:1;margin-bottom:2px}
  .cell .n{font-size:7.5px;font-weight:800;text-transform:uppercase;letter-spacing:.2px;color:#cdd6e3;line-height:1.05;word-break:break-word}
  .page{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;overflow-y:auto;padding:18px}
  .page.open{display:block}
  .page .back{position:fixed;top:10px;left:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;font-size:17px;cursor:pointer;z-index:101;display:flex;align-items:center;justify-content:center}
  .page .back:hover{background:rgba(255,255,255,.15)}
  .page-inner{max-width:860px;margin:0 auto;padding-top:40px}
  /* DETAIL PAGE */
  .dh{text-align:center;margin-bottom:16px}
  .dh .di{font-size:70px;line-height:1;margin-bottom:4px}
  .dh .dp{font-family:Georgia,serif;font-style:italic;font-size:20px;line-height:1.2;margin-bottom:2px}
  .dh .dn{font-size:26px;font-weight:800}
  .dh .dd{font-size:9.5px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:4px}
  .badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
  .badge{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
  .clue{background:rgba(251,191,36,.06);border-left:3px solid var(--gold);padding:12px 14px;border-radius:8px;margin:14px 0;font-size:13.5px;line-height:1.55;color:#e8e2d5}
  .clue b{color:var(--gold)}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:14px 0}
  .info-box{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .info-box .lb{font-size:8.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:3px;font-weight:800}
  .info-box .vl{font-size:12px;color:var(--text);line-height:1.3;word-break:break-word}
  .section-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:1.8px;color:var(--muted);margin:16px 0 8px;font-weight:800}
  .text-block{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.55;color:#d8dfe8}
  .list-block{display:flex;flex-direction:column;gap:5px}
  .list-item{padding:7px 10px;background:rgba(255,255,255,.03);border-radius:6px;font-size:12px;line-height:1.4}
  .list-item.good{border-left:2px solid #10b981}
  .list-item.warn{border-left:2px solid #ef4444}
  .tags-row{display:flex;flex-wrap:wrap;gap:5px}
  .tag{padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:10.5px;color:var(--muted)}
  .link-chip{padding:5px 11px;border-radius:14px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:var(--gold);font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s}
  .link-chip:hover{background:rgba(251,191,36,.22)}
  .weave-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
  .wcard{padding:10px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:2px}
  .wcard:hover{border-color:var(--gold);background:rgba(251,191,36,.06);transform:translateY(-1px)}
  .wcard .wi{font-size:20px;line-height:1}
  .wcard .wn{font-size:11px;font-weight:800}
  .wcard .wp{font-size:9.5px;font-style:italic;color:var(--muted);font-family:Georgia,serif}
  .wcard .wd{font-size:7.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:2px}
  .helpful-btn{width:100%;padding:11px;border-radius:20px;background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.4);color:var(--gold);font-weight:800;cursor:pointer;font-family:inherit;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-top:18px}
  .helpful-btn:hover{background:rgba(251,191,36,.25)}
  .helpful-count{text-align:center;font-size:10px;color:var(--muted);margin-top:5px}
  /* ADMIN */
  .admin-sec{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .admin-sec h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin-bottom:10px;font-weight:800}
  .admin-input,.admin-textarea{width:100%;padding:9px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:7px;color:var(--text);font-family:inherit;font-size:12.5px;outline:none;margin-bottom:7px}
  .admin-input:focus,.admin-textarea:focus{border-color:var(--gold)}
  .admin-textarea{font-family:'Courier New',monospace;font-size:11px;min-height:180px;resize:vertical;line-height:1.5}
  .btn{padding:9px 16px;border-radius:18px;background:var(--gold);color:#000;border:none;font-weight:800;cursor:pointer;font-family:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-right:6px;margin-bottom:6px}
  .btn:hover{filter:brightness(1.1)}
  .btn.secondary{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:rgba(239,68,68,.7);color:#fff}
  .code{background:#000;color:#10b981;padding:10px;border-radius:6px;font-family:'Courier New',monospace;font-size:10.5px;overflow-x:auto;margin-bottom:10px;white-space:pre;line-height:1.5}
  .custom-list{max-height:180px;overflow-y:auto}
  .custom-item{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;border-bottom:1px solid var(--line);font-size:11.5px}
  .custom-item button{background:rgba(239,68,68,.5);color:#fff;border:none;padding:2px 7px;border-radius:5px;cursor:pointer;font-size:10px}
  #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--gold);color:#000;padding:9px 18px;border-radius:18px;font-weight:800;font-size:11.5px;opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:640px){
    #grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;padding:8px 10px}
    .cell .i{font-size:18px}.cell .n{font-size:7px}
    .dh .di{font-size:54px}.dh .dn{font-size:22px}
    .weave-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  }
</style>
</head>
<body>

<header>
  <div class="brand">🌍 <em>Biodiversity</em></div>
  <div class="search">
    <span>🔍</span>
    <input id="q" placeholder="Search…" oninput="S.search(this.value)" autocomplete="off">

  </div>
  <button class="icon-btn" onclick="S.surprise()" title="Random">🎲</button>
  <button class="icon-btn" onclick="S.openAdmin()" title="Steward">⚙️</button>

<div id="chips"></div>
<main id="grid"></main>

<div class="page" id="detail-page"><button class="back" onclick="S.closeDetail()">←</button><div class="page-inner" id="detail-body"></div></div>
<div class="page" id="admin-page"><button class="back" onclick="S.closeAdmin()">←</button><div class="page-inner" id="admin-body"></div></div>

<div id="toast"></div>

// ==================== ENGINE ====================
function hash(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}return Math.abs(h>>>0)}

const S = {
  all:[], cur:-1, q:'', help:{},

  init(){
    this.buildIndex();
    this.loadCustom();
    this.loadHelp();
    this.renderChips();
    this.render();
    const u = localStorage.getItem(K_PACK);
    if(u) this.fetchPack(u, true);
  },

  buildIndex(){
    this.all = [];
    D.forEach((d,di)=>{
      d.items.forEach(it=>{
        const hv = (hash(it.n) % 60) - 30;
        let hue = d.h + hv; if(hue<0) hue+=360; if(hue>=360) hue-=360;
        this.all.push({...it, d:di, dname:d.n, baseHue:d.h, hue, idx:this.all.length});
      });
    });
  },

  loadCustom(){
    try {
      const c = JSON.parse(localStorage.getItem(K_CUSTOM)||'[]');
      c.forEach(x=>this.addItem(x,false));
    } catch {}
  },

  findDim(c){
    if(typeof c.dimension==='number' && c.dimension>=0 && c.dimension<D.length) return c.dimension;
    if(typeof c.dimension==='string'){
      const i = D.findIndex(d=>d.n.toLowerCase()===c.dimension.toLowerCase());
      if(i>=0) return i;
    }
    const scores = D.map(d=>{
      let s=0;
      d.items.forEach(it=>{ s += (it.tags||[]).filter(t=>(c.tags||[]).includes(t)).length });
      return s;
    });
    const best = scores.indexOf(Math.max(...scores));
    return best>=0?best:0;
  },

  addItem(c, save){
    const di = this.findDim(c);
    const d = D[di];
    const hv = (hash(c.name) % 60) - 30;
    let hue = d.h + hv; if(hue<0) hue+=360; if(hue>=360) hue-=360;
    const item = {
      n: c.name, i: c.icon||'✨', p: c.poetic||'', t: c.teaches||'',
      c: c.category||'', tags: c.tags||[],
      usage: c.usage||'', origin: c.origin||'', region: c.region||'',
      season: c.season||'', duration: c.duration||'',
      from: c.from_species||'', related: c.related||[],
      benefits: c.benefits||[], risks: c.risks||[],
      d: di, dname: d.n, baseHue: d.h, hue, idx: this.all.length
    };
    this.all.push(item);
    if(save){
      const cs = JSON.parse(localStorage.getItem(K_CUSTOM)||'[]');
      cs.push(c);
      localStorage.setItem(K_CUSTOM, JSON.stringify(cs));
    }
    return item;
  },

  loadHelp(){ try{ this.help = JSON.parse(localStorage.getItem(K_HELP)||'{}') } catch { this.help = {} } },

  async fetchPack(url, silent){
    try {
      const r = await fetch(url); const data = await r.json();
      const items = Array.isArray(data) ? data : [data];
      items.forEach(x=>this.addItem(x, true));
      this.render();
      if(!silent) this.toast(`Fetched ${items.length} items`);
      return true;
    } catch(e) { if(!silent) this.toast('Fetch failed'); return false; }
  },

  renderChips(){
    document.getElementById('chips').innerHTML =
      `<button class="chip ${this.cur===-1?'active':''}" onclick="S.filter(-1)">🌍 All</button>` +
      D.map((d,i)=>`<button class="chip ${this.cur===i?'active':''}" style="--h:${d.h}" onclick="S.filter(${i})">${d.icon} ${d.n}</button>`).join('');
  },

  filter(di){ this.cur = di; document.querySelectorAll('#chips .chip').forEach((c,i)=>c.classList.toggle('active', i-1===di)); this.render() },

  search(q){
    this.q = q.trim();
    const dot = document.getElementById('dot');
    if(!this.q){ dot.style.background='transparent'; dot.style.boxShadow='none' }
    else { const h = hash(this.q)%360; dot.style.background=`hsl(${h},80%,60%)`; dot.style.boxShadow=`0 0 10px hsl(${h},80%,60%)` }
    this.render();
  },

  score(x, q){
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    let s = 0;
    const nm = x.n.toLowerCase(), p = x.p.toLowerCase(), t = x.t.toLowerCase();
    const tags = (x.tags||[]).map(t=>t.toLowerCase());
    const usage = (x.usage||'').toLowerCase();
    for(const w of words){
      if(nm===w) s+=30; else if(nm.includes(w)) s+=15;
      if(p.includes(w)) s+=10;
      if(tags.some(t=>t.includes(w))) s+=8;
      if(t.includes(w)) s+=3;
      if(usage.includes(w)) s+=5;
    }
    const qh = hash(q)%360;
    const diff = Math.min(Math.abs(x.hue-qh), 360-Math.abs(x.hue-qh));
    if(diff < 20) s += 4;
    return s;
  },

  render(){
    let list = this.all;
    if(this.cur>=0) list = list.filter(x=>x.d===this.cur);
    if(this.q){
      list = list.map(x=>({x, s:this.score(x,this.q)}))
        .filter(o=>o.s>0)
        .sort((a,b)=>b.s-a.s)
        .map(o=>o.x);
    }
    const grid = document.getElementById('grid');
    if(!list.length){
      grid.innerHTML = `<div style="grid-column:1/-1;color:var(--muted);padding:30px;text-align:center;font-size:12px">No matches. Try another word, or add via ⚙️</div>`;
      return;
    }
    grid.innerHTML = list.map(x=>`
      <div class="cell" style="--h:${x.hue}" onclick="S.select(${x.idx})">
        <div class="i">${x.i}</div>
        <div class="n">${x.n}</div>
      </div>`).join('');
  },

  select(idx){
    const item = this.all[idx]; if(!item) return;
    const weave = this.weave(item);
    const nearby = this.sameDim(item, 6);
    const productsFrom = this.productsFrom(item);
    const sourceSpecies = item.from ? this.all.find(x=>x.n===item.from) : null;
    const helped = this.help[item.n]||0;

    // Build conditional sections
    let html = `
      <div class="dh">
        <div class="di">${item.i}</div>
        ${item.p?`<div class="dp" style="color:hsl(${item.hue},80%,68%)">${item.p}</div>`:''}
        <div class="dn">${item.n}</div>
        <div class="dd">${item.dname}</div>
      </div>
    `;

    // Badges: category + from_species
    const badges = [];
    if(item.c) badges.push(`<span class="badge" style="background:hsl(${item.hue},60%,20%);color:hsl(${item.hue},80%,70%)">${item.c}</span>`);
    if(sourceSpecies) badges.push(`<span class="link-chip" onclick="event.stopPropagation();S.select(${sourceSpecies.idx})">from ${sourceSpecies.i} ${sourceSpecies.n}</span>`);
    if(badges.length) html += `<div class="badges">${badges.join('')}</div>`;

    // Clue
    if(item.t) html += `<div class="clue"><b>Clue →</b> ${item.t}</div>`;

    // Info grid (only fields that exist)
    const infoBoxes = [];
    if(item.origin) infoBoxes.push(this.infoBox('Origin', item.origin));
    if(item.region) infoBoxes.push(this.infoBox('Region', item.region));
    if(item.season) infoBoxes.push(this.infoBox('Season', item.season));
    if(item.duration) infoBoxes.push(this.infoBox('Duration', item.duration));
    if(infoBoxes.length) html += `<div class="info-grid">${infoBoxes.join('')}</div>`;

    // Usage
    if(item.usage) html += `<div class="section-lbl">How humans use it</div><div class="text-block">${item.usage}</div>`;

    // Products from this species
    if(productsFrom.length) html += `
      <div class="section-lbl">Products from this ${item.c==='species'?'species':'one'}</div>
      <div class="weave-grid">${productsFrom.map(x=>`
        <div class="wcard" onclick="S.select(${x.idx})">
          <div class="wi">${x.i}</div><div class="wn">${x.n}</div>
          <div class="wp">${x.p}</div><div class="wd">${x.dname}</div>
        </div>`).join('')}</div>
    `;

    // Benefits & risks
    if(item.benefits && item.benefits.length) html += `
      <div class="section-lbl">Benefits</div>
      <div class="list-block">${item.benefits.map(b=>`<div class="list-item good">✓ ${b}</div>`).join('')}</div>
    `;
    if(item.risks && item.risks.length) html += `
      <div class="section-lbl">Risks</div>
      <div class="list-block">${item.risks.map(r=>`<div class="list-item warn">⚠ ${r}</div>`).join('')}</div>
    `;

    // Tags
    if(item.tags && item.tags.length) html += `
      <div class="section-lbl">What it gives</div>
      <div class="tags-row">${item.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
    `;

    // Weave (cross-dimension)
    if(weave.length) html += `
      <div class="section-lbl">Weaves with · across dimensions</div>
      <div class="weave-grid">${weave.map(w=>`
        <div class="wcard" onclick="S.select(${w.idx})">
          <div class="wi">${w.i}</div><div class="wn">${w.n}</div>
          <div class="wp">${w.p}</div><div class="wd">${w.dname}</div>
        </div>`).join('')}</div>
    `;

    // Nearby (same dimension)
    if(nearby.length) html += `
      <div class="section-lbl">Walk nearby · same dimension</div>
      <div class="weave-grid">${nearby.map(w=>`
        <div class="wcard" onclick="S.select(${w.idx})">
          <div class="wi">${w.i}</div><div class="wn">${w.n}</div>
          <div class="wp">${w.p}</div>
        </div>`).join('')}</div>
    `;

    // Helpful
    html += `
      <button class="helpful-btn" onclick="S.markHelpful('${item.n.replace(/'/g,"\\'")}')">✓ This helped me</button>
      <div class="helpful-count">${helped} ${helped===1?'person found':'people found'} this useful</div>
    `;

    document.getElementById('detail-body').innerHTML = html;
    document.getElementById('detail-page').classList.add('open');
    document.getElementById('detail-page').scrollTop = 0;
  },

  infoBox(l, v){ return `<div class="info-box"><div class="lb">${l}</div><div class="vl">${v}</div></div>` },

  closeDetail(){ document.getElementById('detail-page').classList.remove('open') },

  markHelpful(name){
    this.help[name] = (this.help[name]||0)+1;
    localStorage.setItem(K_HELP, JSON.stringify(this.help));
    this.toast('Noted. Thank you.');
    const i = this.all.findIndex(x=>x.n===name);
    if(i>=0) this.select(i);
  },

  weave(item){
    const myTags = new Set(item.tags||[]);
    const byDim = {};
    this.all.forEach(o=>{
      if(o.d===item.d) return;
      const ov = (o.tags||[]).filter(t=>myTags.has(t));
      if(!ov.length) return;
      if(!byDim[o.d] || byDim[o.d]._s < ov.length) byDim[o.d] = {...o, _s:ov.length};
    });
    return Object.values(byDim).sort((a,b)=>b._s-a._s).slice(0,6);
  },

  sameDim(item, n){
    const same = this.all.filter(x=>x.d===item.d && x.idx!==item.idx);
    return same.sort(()=>Math.random()-.5).slice(0,n);
  },

  productsFrom(item){
    // If this is a species, find products that reference it
    if(item.c !== 'species') return [];
    return this.all.filter(x=>x.from === item.n);
  },

  surprise(){
    const it = this.all[Math.floor(Math.random()*this.all.length)];
    this.select(it.idx);
    this.toast(`🎲 ${it.i} ${it.n} — ${it.p}`);
  },

  toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(this._tt);
    this._tt = setTimeout(()=>t.classList.remove('show'), 2400);
  },

  // ===== ADMIN =====
  openAdmin(){
    document.getElementById('admin-body').innerHTML = `
      <div style="text-align:center;margin-bottom:16px">
        <h1 style="font-size:22px;font-weight:800;margin-bottom:4px">⚙️ Steward Access</h1>
        <p style="color:var(--muted);font-size:11.5px">Enter steward password to upload or export cards.</p>
      </div>
      <div class="admin-sec">
        <input type="password" class="admin-input" id="admin-pass" placeholder="Password" style="font-size:16px;padding:12px;text-align:center" autofocus>
        <button class="btn" style="width:100%;margin-top:6px" onclick="S.tryAdmin()">Enter</button>
        <p style="font-size:10px;color:var(--muted);text-align:center;margin-top:8px">Trusted-contributor gate, not secure authentication.</p>
      </div>
    `;
    document.getElementById('admin-page').classList.add('open');
    setTimeout(()=>{
      const el = document.getElementById('admin-pass');
      if(el) el.addEventListener('keypress', e => { if(e.key==='Enter') S.tryAdmin() });
    }, 100);
  },

  tryAdmin(){
    const el = document.getElementById('admin-pass');
    const pass = (el.value||'').trim().toLowerCase();
    if(pass !== ADMIN_PASS){
      this.toast(`Wrong password. Hint: "${ADMIN_PASS}"`);
      return;
    }
    this.renderAdmin();
  },

  renderAdmin(){
    const cs = JSON.parse(localStorage.getItem(K_CUSTOM)||'[]');
    const pack = localStorage.getItem(K_PACK)||'';
    document.getElementById('admin-body').innerHTML = `
      <div style="text-align:center;margin-bottom:16px">
        <h1 style="font-size:20px;font-weight:800">✅ Steward Panel</h1>
        <p style="color:var(--muted);font-size:11px">${cs.length} custom items · ${this.all.length} total</p>
      </div>

      <div class="admin-sec">
        <h3>📥 Add cards (paste JSON)</h3>
        <p style="color:var(--muted);font-size:11px;margin-bottom:6px">One object or an array. Only <b>name</b> and <b>icon</b> are required — every other field is optional and renders only if present.</p>
        <div class="code">[{
  "name": "Civet",
  "icon": "🐈",
  "dimension": "Gifts of Nature",
  "poetic": "bitter reformer",
  "teaches": "A civet eats the bean...",
  "tags": ["food","bitter","wonder"],
  "category": "species",
  "region": "Southeast Asia",
  "usage": "..."
}]

Fields: name*, icon*, dimension, poetic,
teaches, tags[], category, usage, origin,
region, season, duration, from_species,
benefits[], risks[], related[]
* = required</div>
        <textarea class="admin-textarea" id="admin-json" placeholder='[{"name":"...","icon":"..."}]'></textarea>
        <button class="btn" onclick="S.adminAdd()">＋ Add</button>
        <button class="btn secondary" onclick="S.loadSample()">Load Sample</button>
      </div>

      <div class="admin-sec">
        <h3>💾 Export / Import</h3>
        <button class="btn secondary" onclick="S.adminExport()">⬇ Download</button>
        <button class="btn secondary" onclick="document.getElementById('admin-file').click()">⬆ Import</button>
        <input type="file" id="admin-file" accept=".json" style="display:none" onchange="S.adminImport(event)">
      </div>

      <div class="admin-sec">
        <h3>🌐 Fetch from URL</h3>
        <p style="color:var(--muted);font-size:11px;margin-bottom:6px">Host your JSON on GitHub Raw. Every visitor with this URL auto-loads it.</p>
        <input type="text" class="admin-input" id="admin-pack-url" placeholder="https://raw.githubusercontent.com/..." value="${pack}">
        <button class="btn" onclick="S.adminSetPack()">Set & Fetch</button>
        <button class="btn secondary" onclick="S.adminClearPack()">Clear</button>
      </div>

      <div class="admin-sec">
        <h3>📋 Custom items (${cs.length})</h3>
        <div class="custom-list" id="custom-list"></div>
        ${cs.length?`<button class="btn danger" style="margin-top:8px" onclick="S.adminClearAll()">Delete All Custom</button>`:''}
      </div>

      <div class="admin-sec">
        <h3>ℹ️ How updates reach everyone</h3>
        <p style="color:var(--muted);font-size:11px;line-height:1.6">
          Without a backend, sync works three ways:<br>
          1. <b>localStorage</b> — auto-saves on your device.<br>
          2. <b>Export → GitHub Raw → Set URL</b> — everyone with the URL auto-fetches.<br>
          3. <b>Export/Import files</b> — manual sharing.<br><br>
          Real-time multi-user sync needs one small backend. The JSON format stays the same when you add it.
        </p>
      </div>
    `;
    this.renderCustom(cs);
  },

  renderCustom(cs){
    const el = document.getElementById('custom-list'); if(!el) return;
    if(!cs.length){ el.innerHTML = '<p style="color:var(--muted);font-size:11px">No custom items yet.</p>'; return; }
    el.innerHTML = cs.map((c,i)=>`<div class="custom-item"><span>${c.icon||'✨'} <b>${c.name||'?'}</b> <span style="color:var(--muted);font-size:10px">${c.dimension||'auto'}</span></span><button onclick="S.adminDelete(${i})">×</button></div>`).join('');
  },

  loadSample(){
    document.getElementById('admin-json').value = JSON.stringify([{
      name: 'Civet',
      icon: '🐈',
      poetic: 'bitter reformer',
      teaches: 'A civet eats the coffee bean, its gut makes it bitter. Why pay more for what was made worse?',
      tags: ['food', 'bitter', 'wonder'],
      category: 'species',
      region: 'Southeast Asia',
      usage: 'In the wild, a civet eats coffee cherries; the fermented beans are collected from its droppings and sold at high prices.',
      benefits: ['supports farmers', 'unique flavour'],
      risks: ['animal cruelty in caged farming', 'very high price'],
      from_species: ''
    }, {
      name: 'Kalaripayattu',
      icon: '🥋',
      poetic: 'martial heritage',
      teaches: 'What strikes and what protects?',
      tags: ['sport', 'martial', 'india'],
      dimension: 'Sports & Games',
      category: 'sport',
      origin: 'Kerala',
      region: 'South India',
      usage: 'Ancient Indian martial art of striking, grappling, and weapons.',
      benefits: ['fitness', 'discipline', 'self-defence']
    }], null, 2);
    this.toast('Sample loaded — edit and click Add');
  },

  adminAdd(){
    const raw = document.getElementById('admin-json').value.trim();
    if(!raw){ this.toast('Paste JSON first'); return }
    let data;
    try { data = JSON.parse(raw) } catch(e){ this.toast('Invalid JSON: ' + e.message.substring(0,40)); return }
    const items = Array.isArray(data) ? data : [data];
    let n = 0;
    items.forEach(c=>{
      if(!c.name){ return }
      this.addItem(c, true);
      n++;
    });
    if(n){
      this.render();
      this.renderAdmin();
      this.toast(`Added ${n} item${n>1?'s':''}`);

      this.toast('Nothing added — check the "name" field');
    }
  },

  adminExport(){
    const cs = JSON.parse(localStorage.getItem(K_CUSTOM)||'[]');
    const blob = new Blob([JSON.stringify(cs, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `biodiversity-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
    this.toast(`Downloaded ${cs.length} items`);
  },

  adminImport(e){
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        const items = Array.isArray(data) ? data : [data];
        items.forEach(c=>{ if(c.name) this.addItem(c, true) });
        this.render(); this.renderAdmin();
        this.toast(`Imported ${items.length} items`);
      } catch { this.toast('Invalid file') }
    };
    r.readAsText(f);
  },

  adminSetPack(){
    const url = document.getElementById('admin-pack-url').value.trim();
    if(!url){ this.toast('Enter a URL'); return }
    localStorage.setItem(K_PACK, url);
    this.fetchPack(url, false);
    this.toast('URL saved — auto-fetches on load');
  },

  adminClearPack(){
    localStorage.removeItem(K_PACK);
    const el = document.getElementById('admin-pack-url'); if(el) el.value='';
    this.toast('URL cleared');
  },

  adminDelete(i){
    const cs = JSON.parse(localStorage.getItem(K_CUSTOM)||'[]');
    cs.splice(i,1);
    localStorage.setItem(K_CUSTOM, JSON.stringify(cs));
    this.buildIndex(); this.loadCustom(); this.render(); this.renderAdmin();
  },

  adminClearAll(){
    if(!confirm('Delete all custom items? Base spectrum stays.')) return;
    localStorage.removeItem(K_CUSTOM);
    this.buildIndex(); this.render(); this.renderAdmin();
    this.toast('Cleared');
  },

  closeAdmin(){ document.getElementById('admin-page').classList.remove('open') }
};

window.onload = () => S.init();
</script>
</body>
</html>
